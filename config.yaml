name: "ebusd TypeSpec Compiler"
description: "Home Assistant addon to clone an ebusd-configuration repository (TypeSpec), compiles it for all languages and exports the generated CSV files to a configurable path."
version: "1.6.1"
slug: "ebusd_typespec_compiler"
icon: "/icon.png"
logo: "/logo.png"
init: false
boot: manual
arch:
  - aarch64
  - amd64
image: "ghcr.io/muewe/ha-ebusd-typespec-compiler"
homeassistant_api: false
hassio_api: false
map:
  - config:rw
  - share:rw
options:
  repo_url: "https://github.com/john30/ebusd-configuration"
  branch: "master"
  dependency_mode: compatible
  ignore_compile_errors: false
  entrypoint: ""
  languages:
    - de
    - en
  output_path: "/config/ebusd-configuration"
schema:
  repo_url: str
  branch: str
  dependency_mode: list(compatible|repository)
  ignore_compile_errors: bool?
  entrypoint: str?
  languages:
    - list(de|en)
  output_path: str
